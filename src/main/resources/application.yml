email:
  address: ${EMAIL_ADDRESS}

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.example.controller: DEBUG
    org.example.service: DEBUG
    org.springframework: INFO
    root: INFO
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 7
